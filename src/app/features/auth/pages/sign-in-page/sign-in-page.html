<section class="flex min-h-full items-center justify-center px-4 py-12 sm:px-6">
  <form class="w-full max-w-md space-y-6" novalidate>
    <header class="space-y-2 text-center">
      <h1 class="text-3xl font-bold tracking-tight text-base-content sm:text-4xl">
        Inicia sesión
      </h1>

      <p class="text-base text-base-content/65 sm:text-lg">
        Accede a tu espacio de pareja.
      </p>
    </header>

    <div class="space-y-5">
      <div class="space-y-2">
        <label class="text-sm font-semibold text-base-content" for="email">
          Correo electrónico
        </label>

        <input
          class="input w-full border-base-300 bg-base-100 focus:border-[#7c3b70] focus:outline-[#7c3b70]"
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="space-y-2">
        <label class="text-sm font-semibold text-base-content" for="password">
          Contraseña
        </label>

        <input
          class="input w-full border-base-300 bg-base-100 focus:border-[#7c3b70] focus:outline-[#7c3b70]"
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="flex justify-end">
        <!-- Add this link only when the password-reset route exists. -->
        <a class="text-sm font-medium text-[#7c3b70] underline-offset-4 hover:underline">
          ¿Olvidaste tu contraseña?
        </a>
      </div>
    </div>

    <button
      class="btn w-full border-0 bg-[#7c3b70] text-white shadow-sm hover:bg-[#682f5e]"
      type="submit"
    >
      Iniciar sesión
    </button>

    <div class="divider text-sm text-base-content/50">o</div>

    <p class="text-center text-sm text-base-content/70">
      ¿Aún no tienes una cuenta?

      <a
        class="font-semibold text-[#7c3b70] underline underline-offset-4"
        routerLink="/auth/sign-up"
      >
        Crear una cuenta
      </a>
    </p>
  </form>
</section>
