<div class="space-y-6">
  <section class="mx-auto max-w-5xl border-b border-base-300">
    <nav
      class="flex flex-col gap-3 pt-1 sm:flex-row sm:items-end sm:justify-between"
      aria-label="Secciones de finanzas"
    >
      <ul class="flex min-w-0 items-stretch" role="list">
        <li>
          <a
            class="relative flex min-h-15 items-center gap-2 px-4 text-sm font-semibold text-base-content/65 transition-colors after:absolute after:right-4 after:bottom-0 after:left-4 after:h-0.75 after:origin-left after:scale-x-0 after:rounded-full after:bg-primary after:transition-transform hover:text-primary sm:px-5 sm:text-base sm:after:right-5 sm:after:left-5"
            routerLink="/app/finance/dashboard"
            routerLinkActive="!text-primary after:!scale-x-100"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <svg
              class="size-5 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            <span>Resumen</span>
          </a>
        </li>

        <li>
          <a
            class="relative flex min-h-15 items-center gap-2 px-4 text-sm font-semibold text-base-content/65 transition-colors after:absolute after:right-4 after:bottom-0 after:left-4 after:h-0.75 after:origin-left after:scale-x-0 after:rounded-full after:bg-primary after:transition-transform hover:text-primary sm:px-5 sm:text-base sm:after:right-5 sm:after:left-5"
            routerLink="/app/finance/activity"
            routerLinkActive="!text-primary after:!scale-x-100"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <svg
              class="size-5 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 6h16" />
              <path d="M4 12h16" />
              <path d="M4 18h10" />
              <circle cx="18" cy="18" r="2" />
            </svg>
            <span>Actividad</span>
          </a>
        </li>
      </ul>

      <a
        class="btn btn-primary mb-3 min-h-12 w-full rounded-xl border-0 px-5 shadow-sm transition-transform hover:-translate-y-0.5 sm:w-auto"
        routerLink="/app/finance/register"
        routerLinkActive="ring-2 ring-primary/20 ring-offset-2"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg
          class="size-5 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v8" />
          <path d="M8 12h8" />
        </svg>
        Registrar movimiento
      </a>
    </nav>
  </section>

  <router-outlet />
</div>
